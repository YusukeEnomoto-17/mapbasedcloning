<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マップベースクローニング図解</title>
    
    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX変換用 - 本番運用ではビルド推奨ですが手軽さ優先) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 追加のカスタムスタイルがあればここに */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- アイコンコンポーネント (LucideのSVGを直書き) ---
        const Dna = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 15c6.667-6 13.333 0 20-6"/><path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993"/><path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993"/><path d="M17 6l-2.5-2.5"/><path d="M14 8l-1-1"/><path d="M7 18l2.5 2.5"/><path d="M3.5 14.5l.5.5"/><path d="M20 9l.5.5"/><path d="M6.5 12.5l1 1"/><path d="M16.5 10.5l1 1"/><path d="M10 16l1.5 1.5"/></svg>
        );
        const ArrowDown = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
        );
        const RefreshCw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
        );
        const Microscope = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>
        );

        // --- メインロジック ---

        // 色とラベルの定義
        const LABELS = {
            mutant: {
                name: 'CaD428 (Col-0)',
                short: 'Col-0',
                desc: '変異型',
                baseColor: 'bg-rose-500',
                lightColor: 'bg-rose-50',
                borderColor: 'border-rose-300',
                svgColor: '#f43f5e', // rose-500
                textColor: 'text-rose-700'
            },
            wild: {
                name: 'Ler',
                short: 'Ler',
                desc: '野生型',
                baseColor: 'bg-blue-500',
                lightColor: 'bg-blue-50',
                borderColor: 'border-blue-300',
                svgColor: '#3b82f6', // blue-500
                textColor: 'text-blue-700'
            }
        };

        // 1本の染色体を描画するコンポーネント (組換え対応)
        const SingleChromosome = ({ state, height = 80, width = 10, hasGene = false }) => {
            const topColor = state.top === 'mutant' ? LABELS.mutant.svgColor : LABELS.wild.svgColor;
            const bottomColor = state.bottom === 'mutant' ? LABELS.mutant.svgColor : LABELS.wild.svgColor;
            const isRecombinant = state.top !== state.bottom;

            return (
                <div className="flex flex-col items-center mx-0.5 relative group">
                    <svg width={width} height={height} className="drop-shadow-sm overflow-visible">
                        {/* 上部 (Gene side) */}
                        <path 
                            d={`M0,${width/2} L0,${height/2} L${width},${height/2} L${width},${width/2} A${width/2},${width/2} 0 0 0 0,${width/2}`} 
                            fill={topColor} 
                        />
                        {/* 下部 (Marker side) */}
                        <path 
                            d={`M0,${height/2} L0,${height - width/2} A${width/2},${width/2} 0 0 0 ${width},${height - width/2} L${width},${height/2} Z`} 
                            fill={bottomColor} 
                        />
                        
                        {/* 組換え地点の継ぎ目 */}
                        {isRecombinant && (
                            <rect x="0" y={height/2 - 0.5} width={width} height="1" fill="rgba(255,255,255,0.8)" />
                        )}

                        {hasGene && (
                            <g transform={`translate(0, ${height * 0.25})`}>
                                <line x1="-1" y1="0" x2={width + 1} y2="0" stroke="white" strokeWidth="1.5" />
                            </g>
                        )}
                    </svg>
                </div>
            );
        };

        // 1つの細胞（個体）内の染色体セット (2n=4)
        const CellChromosomes = ({ pair1, pair2, scale = 1.0, showLabel = true }) => {
            return (
                <div className="flex gap-2 p-1.5 bg-white/70 rounded border border-slate-200 shadow-sm" style={{ transform: `scale(${scale})`, transformOrigin: 'center' }}>
                    {/* 第1染色体ペア (連鎖・乗換えあり) */}
                    <div className="flex flex-col items-center">
                        <div className="flex gap-1">
                            <SingleChromosome state={pair1[0]} height={60} hasGene={true} />
                            <SingleChromosome state={pair1[1]} height={60} hasGene={true} />
                        </div>
                        {showLabel && <span className="text-[8px] text-slate-400 font-bold mt-0.5">Chr 1</span>}
                    </div>

                    {/* 第2染色体ペア (独立) */}
                    <div className="flex flex-col items-center">
                        <div className="flex gap-1">
                            <SingleChromosome state={pair2[0]} height={40} hasGene={false} />
                            <SingleChromosome state={pair2[1]} height={40} hasGene={false} />
                        </div>
                        {showLabel && <span className="text-[8px] text-slate-400 font-bold mt-0.5">Chr 2</span>}
                    </div>
                </div>
            );
        };

        // 配偶子 (n=2)
        const Gamete = ({ chr1, chr2, index }) => {
            const isRecombinant = chr1.top !== chr1.bottom;
            return (
                <div className={`
                    relative flex flex-col items-center justify-center rounded-full w-14 h-14 border 
                    ${isRecombinant ? 'bg-yellow-50 border-yellow-400 border-dashed' : 'bg-white border-slate-200 border-dashed'}
                    shadow-sm hover:scale-110 transition-transform
                `}>
                    <div className="flex gap-1 items-end">
                        <SingleChromosome state={chr1} height={30} width={6} hasGene={true} />
                        <SingleChromosome state={chr2} height={20} width={6} hasGene={false} />
                    </div>
                    {isRecombinant && (
                        <div className="absolute -top-1 -right-1 w-3 h-3 bg-yellow-400 rounded-full border border-white" title="乗換えあり" />
                    )}
                    <span className="absolute -bottom-4 text-[9px] text-slate-400">#{index + 1}</span>
                </div>
            );
        };

        // --- メインコンポーネント ---
        const MapBasedCloningBulk = () => {
            const [seed, setSeed] = useState(0);

            // 配偶子生成ロジック
            const generateGamete = () => {
                const geneType = Math.random() < 0.5 ? 'mutant' : 'wild';
                const crossover = Math.random() < 0.3; // 組換え率30%
                const chr1Bottom = crossover 
                    ? (geneType === 'mutant' ? 'wild' : 'mutant')
                    : geneType;
                const chr2Type = Math.random() < 0.5 ? 'mutant' : 'wild';

                return {
                    chr1: { top: geneType, bottom: chr1Bottom },
                    chr2: { top: chr2Type, bottom: chr2Type }
                };
            };

            // F1配偶子群の生成 (10個)
            const f1Gametes = useMemo(() => {
                return Array(10).fill(null).map(() => generateGamete());
            }, [seed]);

            // F2生成ロジック
            const f2Individuals = useMemo(() => {
                const totalCount = 40;
                const targetMutantCount = 10;
                const othersCount = totalCount - targetMutantCount;
                const individuals = [];

                // 1. 潜性ホモ個体
                for (let i = 0; i < targetMutantCount; i++) {
                    const makeMutantGamete = () => {
                        let g = generateGamete();
                        if (g.chr1.top !== 'mutant') {
                            g.chr1.top = 'mutant';
                            g.chr1.bottom = g.chr1.bottom === 'mutant' ? 'wild' : 'mutant';
                        }
                        return g;
                    };
                    individuals.push({
                        id: `mut-${i}`,
                        pair1: [makeMutantGamete().chr1, makeMutantGamete().chr1], 
                        pair2: [generateGamete().chr2, generateGamete().chr2], 
                        isMutantPhenotype: true
                    });
                }

                // 2. その他の個体
                for (let i = 0; i < othersCount; i++) {
                    let g1 = generateGamete();
                    let g2 = generateGamete();
                    if (g1.chr1.top === 'mutant' && g2.chr1.top === 'mutant') {
                        g1.chr1.top = 'wild';
                        g1.chr1.bottom = 'wild'; 
                    }
                    individuals.push({
                        id: `wild-${i}`,
                        pair1: [g1.chr1, g2.chr1],
                        pair2: [g1.chr2, g2.chr2],
                        isMutantPhenotype: false
                    });
                }
                
                return individuals.sort(() => Math.random() - 0.5);
            }, [seed]);

            return (
                <div className="min-h-screen bg-slate-100 text-slate-800 font-sans pb-32">
                    {/* Header */}
                    <header className="bg-slate-900 text-white px-6 py-4 shadow-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-1.5 rounded">
                                    <Dna className="w-5 h-5 text-white" />
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold leading-tight">マップベースクローニング実験</h1>
                                    <p className="text-xs text-slate-400">CaD428 (Col-0) × Ler</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => setSeed(s => s + 1)}
                                className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-xs font-bold transition-colors shadow active:scale-95"
                            >
                                <RefreshCw className="w-4 h-4" />
                                実験をやり直す
                            </button>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 space-y-12">
                        {/* P Generation */}
                        <section className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden">
                            <div className="absolute left-0 top-0 bg-slate-800 text-white px-4 py-1 rounded-br-lg text-sm font-bold">P世代</div>
                            <div className="flex justify-center items-center gap-12 mt-4">
                                <div className="flex flex-col items-center gap-2">
                                    <span className={`font-bold px-3 py-1 rounded-full text-sm ${LABELS.mutant.lightColor} ${LABELS.mutant.textColor}`}>
                                        {LABELS.mutant.name}
                                    </span>
                                    <CellChromosomes 
                                        pair1={[{top:'mutant', bottom:'mutant'}, {top:'mutant', bottom:'mutant'}]} 
                                        pair2={[{top:'mutant', bottom:'mutant'}, {top:'mutant', bottom:'mutant'}]} 
                                        scale={1.2}
                                    />
                                    <div className="text-xs text-center text-slate-400 mt-1">変異型ホモ (m/m)</div>
                                </div>
                                <div className="flex flex-col items-center">
                                    <span className="text-2xl text-slate-300 font-light">×</span>
                                </div>
                                <div className="flex flex-col items-center gap-2">
                                    <span className={`font-bold px-3 py-1 rounded-full text-sm ${LABELS.wild.lightColor} ${LABELS.wild.textColor}`}>
                                        {LABELS.wild.name}
                                    </span>
                                    <CellChromosomes 
                                        pair1={[{top:'wild', bottom:'wild'}, {top:'wild', bottom:'wild'}]} 
                                        pair2={[{top:'wild', bottom:'wild'}, {top:'wild', bottom:'wild'}]} 
                                        scale={1.2}
                                    />
                                    <div className="text-xs text-center text-slate-400 mt-1">野生型ホモ (+/+)</div>
                                </div>
                            </div>
                        </section>

                        {/* F1 Gametes */}
                        <section className="relative">
                            <div className="flex items-center gap-2 mb-4">
                                <span className="bg-slate-800 text-white w-8 h-8 flex items-center justify-center rounded-full text-sm font-bold shadow-md">F1</span>
                                <h2 className="text-lg font-bold text-slate-700">F1が作る配偶子 (10個抽出)</h2>
                                <span className="text-xs text-slate-500 ml-2">※減数分裂時に乗換えが発生</span>
                            </div>
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                <div className="flex flex-wrap justify-center gap-4">
                                    {f1Gametes.map((gamete, idx) => (
                                        <Gamete key={idx} index={idx} chr1={gamete.chr1} chr2={gamete.chr2} />
                                    ))}
                                </div>
                                <div className="mt-6 flex justify-center gap-6 text-xs text-slate-500">
                                    <div className="flex items-center gap-2">
                                        <div className="w-3 h-3 bg-yellow-400 rounded-full"></div>
                                        <span>乗換えが起きた染色体</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="w-3 h-3 bg-white border border-slate-300 rounded-full border-dashed"></div>
                                        <span>親型の染色体</span>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* F2 Generation */}
                        <section className="relative">
                            <div className="flex flex-col md:flex-row md:items-end justify-between mb-4 gap-2">
                                <div className="flex items-center gap-2">
                                    <span className="bg-slate-800 text-white w-8 h-8 flex items-center justify-center rounded-full text-sm font-bold shadow-md">F2</span>
                                    <h2 className="text-lg font-bold text-slate-700">F2 分離集団 (40個体)</h2>
                                </div>
                                <div className="text-xs bg-rose-100 text-rose-800 px-3 py-1 rounded-full font-bold">
                                    潜性ホモ(CaD428表現型)の10個体を強調表示中
                                </div>
                            </div>

                            <div className="bg-slate-200/50 p-4 rounded-xl border border-slate-300 shadow-inner">
                                <div className="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-8 gap-3">
                                    {f2Individuals.map((ind, i) => {
                                        const isRecombinant = (ind.pair1[0].top !== ind.pair1[0].bottom) || (ind.pair1[1].top !== ind.pair1[1].bottom);
                                        return (
                                            <div 
                                                key={ind.id} 
                                                className={`
                                                    relative flex flex-col items-center p-2 rounded-lg border transition-all duration-300 group
                                                    ${ind.isMutantPhenotype 
                                                        ? 'bg-white border-rose-500 shadow-md ring-2 ring-rose-200 z-10 scale-105' 
                                                        : 'bg-white/60 border-slate-200 opacity-60 hover:opacity-100 hover:scale-105'
                                                    }
                                                `}
                                            >
                                                <div className="absolute top-1 left-2 text-[8px] text-slate-400 font-mono">#{i + 1}</div>
                                                {ind.isMutantPhenotype && (
                                                    <div className="absolute -top-2 right-1 flex gap-1">
                                                        {isRecombinant && (
                                                            <span className="bg-yellow-400 text-yellow-900 text-[8px] px-1 rounded font-bold" title="組換え体">★</span>
                                                        )}
                                                        <span className="bg-rose-500 text-white text-[8px] px-1 rounded font-bold">CaD</span>
                                                    </div>
                                                )}
                                                <CellChromosomes 
                                                    pair1={ind.pair1} 
                                                    pair2={ind.pair2} 
                                                    scale={0.65}
                                                    showLabel={false}
                                                />
                                                <div className="opacity-0 group-hover:opacity-100 absolute bottom-0 left-0 right-0 bg-slate-800/90 text-white text-[9px] p-1 rounded-b text-center pointer-events-none z-20 transition-opacity">
                                                    {ind.isMutantPhenotype ? '変異型(m/m)' : '野生型(+/+ or m/+)'}
                                                    <br/>
                                                    {isRecombinant ? 'Chr1組換えあり' : 'Chr1親型'}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="mt-4 p-4 bg-white rounded-lg border border-slate-200 text-sm shadow-sm flex items-start gap-4">
                                <Microscope className="w-6 h-6 text-slate-400 shrink-0" />
                                <div className="space-y-2">
                                    <p>
                                        <strong>解析のポイント：</strong> 40個体中、強調された<span className="text-rose-600 font-bold">10個体のCaD428表現型</span>のみをDNA抽出して解析します。
                                    </p>
                                    <p className="text-slate-600 text-xs leading-relaxed">
                                        これら変異型個体の第2染色体(Chr2)を見てください。CaD428由来(赤)だけでなく、Ler由来(青)も混ざっています（独立の法則）。
                                        一方、第1染色体(Chr1)は遺伝子座(上部)が必ず赤ですが、下部は時折「青」が混じっています（<span className="bg-yellow-100 text-yellow-800 px-1 rounded">★</span>マーク）。
                                        これが組換え体であり、この出現頻度から遺伝子の位置を特定します。
                                    </p>
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<MapBasedCloningBulk />);
    </script>
</body>
</html>
